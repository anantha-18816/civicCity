# =========================================================================
# CivicAI - Production deployment
# PostGIS + AI service + Spring Boot backend + nginx (dashboard + proxy)
#
# Usage:
#   cd deploy
#   cp .env.example .env        # set DB_PASSWORD and JWT_SECRET
#   docker compose up -d --build
#
# Services:
#   db        PostGIS 16, schema.sql + seed.sql applied on first boot
#   ai-service FastAPI computer-vision service
#   backend   Spring Boot app, env-configured, waits for db healthy
#   proxy     nginx: serves the admin dashboard and proxies /api to backend
#
# After boot:
#   Dashboard (single origin): http://localhost:8080
#   Swagger UI:                http://localhost:8080/swagger-ui.html
#   Backend health:            http://localhost:8080/api/health
#   Officer login (seeded):    officer@civicai.test / officer123
#     - change this in config/OfficerSeeder.java before production use
#
# The AI service listens internally at :8000 and the backend calls it via
# the docker network; only the proxy/backend ports are exposed.
# =========================================================================

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: civicai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  ai-service:
    build: ../ai-service
    environment:
      ALLOWED_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

  backend:
    build: ../backend/civicAI-backend
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/civicai_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-civicai-dev-secret-key-change-in-production-0123456789abcdef}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata: