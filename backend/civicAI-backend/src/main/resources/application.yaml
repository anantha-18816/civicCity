spring:
  application:
    name: civicai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/civicai_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:RishiAnan@7}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:civicai-dev-secret-key-change-in-production-0123456789abcdef}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    http.requests: INFO
    com.civicAI.backend: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

duplicate:
  radius-m: 100
  score-threshold: 0.7
  spatial-weight: 0.6
  image-weight: 0.4
  max-candidates: 10

cluster:
  radius-m: 150
  dense-report-threshold: 5

priority:
  max-report-bonus: 20
  report-bonus-step: 4
  grace-days: 3
  daily-age-bonus: 1.5
  max-age-bonus: 15
  location-bonus: 10
  center-radius-m: 5000
  road-issue-types: POTHOLE,ROAD_DAMAGE
  road-importance-bonus: 8
  refresh-cron: "0 0 */6 * * *"

routing:
  mappings: "POTHOLE:ROADS,ROAD_DAMAGE:ROADS,GARBAGE:SANITATION,STREETLIGHT:LIGHTING,WATER_LOGGING:DRAINAGE"
  default-department-code: ROADS