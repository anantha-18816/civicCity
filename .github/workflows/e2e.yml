name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack (db + ai-service + backend + proxy)
        working-directory: deploy
        run: |
          ls -la
          docker compose up -d --build

      - name: Wait for backend behind the nginx proxy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "backend UP after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8080/api/health

      - name: End-to-end smoke test
        run: |
          set -uo pipefail
          exec > >(tee /tmp/e2e-smoke.log) 2>&1
          BASE=http://localhost:8080
          echo "== register =="
          R=$(curl -sS -X POST $BASE/api/auth/register -H 'Content-Type: application/json' \
              -d "{\"name\":\"e2e\",\"email\":\"e2e-$RANDOM@example.com\",\"password\":\"secret123\"}")
          echo "register body: $R"
          TOKEN=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          UID=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin)["userId"])')
          echo "registered citizen userId=$UID token=${TOKEN:0:12}..."

          echo "== create complaint =="
          C=$(curl -sS -X POST $BASE/api/complaints -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"userId\":$UID,\"issueType\":\"POTHOLE\",\"title\":\"e2e pothole\",\"description\":\"compose e2e\",\"latitude\":17.385,\"longitude\":78.4867}")
          echo "create body: $C"
          CID=$(echo "$C" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo "created complaint id=$CID"

          echo "== AI analysis =="
          printf '%s' '' | base64 -d > /tmp/road.jpg
          echo "image bytes: $(wc -c < /tmp/road.jpg)"
          AN=$(curl -sS -X POST $BASE/api/complaints/$CID/analysis -H "Authorization: Bearer $TOKEN" -F image=@/tmp/road.jpg)
          echo "analysis body: $AN"
          echo "$AN" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["detectedObject"] in ("POTHOLE","NO_ISSUE"), d["detectedObject"]; print("AI OK: detected_object=" + d["detectedObject"] + " confidence=" + str(d["confidence"]))'

          echo "== verify status =="
          ST=$(curl -sS $BASE/api/complaints/$CID -H "Authorization: Bearer $TOKEN" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
          echo "complaint status: $ST"
          [ "$ST" = "AI_ANALYZED" ] && echo "status AI_ANALYZED OK"

          echo "== dashboard via proxy =="
          curl -sS -o /tmp/dashboard.html -w 'dashboard http:%{http_code}\n' $BASE/
          echo "dashboard body: $(head -c 200 /tmp/dashboard.html)"

          echo "== officer login =="
          OL=$(curl -sS -X POST $BASE/api/auth/login -H 'Content-Type: application/json' \
              -d '{"email":"officer@civicai.test","password":"officer123"}')
          echo "$OL" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["role"]=="OFFICER", d; print("officer login OK")'

          echo "== actuator =="
          curl -sS $BASE/actuator/health && echo ""

          echo "======================================"
          echo "E2E PASSED - full stack operational"
          echo "======================================"

      - name: Collect logs on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose ps || true
          docker compose logs --no-color > /tmp/e2e-compose.log 2>&1 || true
          {
            echo "=== SMOKE OUTPUT ==="
            cat /tmp/e2e-smoke.log 2>/dev/null || echo "(no smoke log)"
            echo
            echo "=== COMPOSE LOGS (tail) ==="
            tail -n 300 /tmp/e2e-compose.log
          } > ../e2e-last-run.log
          cd ..
          git config user.email "ci@civicai.test"
          git config user.name "civicai-ci"
          git add -f e2e-last-run.log
          git commit -m "[skip actions] ci: e2e diagnostics" || echo "nothing to commit"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || echo "push failed"