name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack (db + ai-service + backend + proxy)
        working-directory: deploy
        run: |
          ls -la
          docker compose up -d --build

      - name: Wait for backend behind the nginx proxy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "backend UP after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8080/api/health

      - name: End-to-end smoke test
        run: |
          set -euo pipefail
          BASE=http://localhost:8080

          R=$(curl -fsS -X POST $BASE/api/auth/register -H 'Content-Type: application/json' \
              -d "{\"name\":\"e2e\",\"email\":\"e2e-$RANDOM@example.com\",\"password\":\"secret123\"}")
          TOKEN=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          UID=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin)["userId"])')
          echo "registered citizen userId=$UID"

          CID=$(curl -fsS -X POST $BASE/api/complaints -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "{\"userId\":$UID,\"issueType\":\"POTHOLE\",\"title\":\"e2e pothole\",\"description\":\"compose e2e\",\"latitude\":17.385,\"longitude\":78.4867}" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo "created complaint id=$CID"

          printf '%s' '' | base64 -d > /tmp/road.jpg
          ls -la /tmp/road.jpg

          AN=$(curl -fsS -X POST $BASE/api/complaints/$CID/analysis -H "Authorization: Bearer $TOKEN" -F image=@/tmp/road.jpg)
          echo "$AN" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["detectedObject"] in ("POTHOLE","NO_ISSUE"), d; print("AI OK: detected_object=" + d["detectedObject"] + " confidence=" + str(d["confidence"]))'

          ST=$(curl -fsS $BASE/api/complaints/$CID -H "Authorization: Bearer $TOKEN" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
          [ "$ST" = "AI_ANALYZED" ] && echo "status now AI_ANALYZED OK"

          curl -fsS -o /tmp/dashboard.html $BASE/
          echo "dashboard served: $(wc -c < /tmp/dashboard.html) bytes"

          curl -fsS -X POST $BASE/api/auth/login -H 'Content-Type: application/json' \
              -d '{"email":"officer@civicai.test","password":"officer123"}' \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["role"]=="OFFICER"; print("officer login OK")'

          curl -fsS $BASE/actuator/health >/dev/null && echo "actuator health OK"

          echo "======================================"
          echo "E2E PASSED - full stack operational"
          echo "======================================"

      - name: Collect logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color | tail -n 200