name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: civicai_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Load schema
        run: psql -h localhost -U postgres -d civicai_db -f database/schema.sql
        env:
          PGPASSWORD: postgres
      - name: Build & test
        working-directory: backend/civicAI-backend
        run: ./mvnw -B test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/civicai_db
          DB_USER: postgres
          DB_PASSWORD: postgres

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/civicai_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
